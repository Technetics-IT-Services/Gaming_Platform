# =============================================================================
# ConfigMap + Secret (Phase 7, STEP 2 & 3). The ConfigMap holds non-sensitive
# runtime config consumed by the config platform (src/lib/infra/config.ts). The
# Secret is a TEMPLATE — real values are injected by an external secret manager
# (Sealed Secrets / External Secrets Operator / Vault). NEVER commit real secrets.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gaming-platform-config
  namespace: gaming-platform
data:
  NODE_ENV: "production"
  LOG_LEVEL: "warn"
  METRICS_ENABLED: "true"
  PORT: "3000"
  NEXT_TELEMETRY_DISABLED: "1"
  REDIS_MAX_RETRIES: "3"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "20"
  QUEUE_CONCURRENCY: "8"
  HEALTH_QUEUE_WARN: "1000"
  HEALTH_QUEUE_MAX: "10000"
---
apiVersion: v1
kind: Secret
metadata:
  name: gaming-platform-secrets
  namespace: gaming-platform
  annotations:
    # Managed by External Secrets Operator; this manifest documents the keys only.
    external-secrets.io/managed: "true"
type: Opaque
stringData:
  DATABASE_URL: "REPLACED_BY_SECRET_MANAGER"
  DATABASE_REPLICA_URL: "REPLACED_BY_SECRET_MANAGER"
  REDIS_URL: "REPLACED_BY_SECRET_MANAGER"
  JWT_SECRET: "REPLACED_BY_SECRET_MANAGER"
  RAZORPAY_KEY_SECRET: "REPLACED_BY_SECRET_MANAGER"
  RAZORPAY_WEBHOOK_SECRET: "REPLACED_BY_SECRET_MANAGER"
  STRIPE_SECRET_KEY: "REPLACED_BY_SECRET_MANAGER"
  STRIPE_WEBHOOK_SECRET: "REPLACED_BY_SECRET_MANAGER"
  CASHFREE_SECRET_KEY: "REPLACED_BY_SECRET_MANAGER"
  PHONEPE_SALT_KEY: "REPLACED_BY_SECRET_MANAGER"
