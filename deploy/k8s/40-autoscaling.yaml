# =============================================================================
# HorizontalPodAutoscaler + PodDisruptionBudget (Phase 7, STEP 2).
# HPA scales on CPU + memory (and queue depth for the worker); PDB guarantees
# availability during voluntary disruptions (node drains, rollouts).
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: gaming-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Percent, value: 50, periodSeconds: 60 }]
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: gaming-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    # Requires a metrics adapter exposing the queue depth as an external metric.
    - type: External
      external:
        metric: { name: redis_queue_depth, selector: { matchLabels: { queue: jobs } } }
        target: { type: AverageValue, averageValue: "500" }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: gaming-platform
spec:
  minAvailable: 2
  selector: { matchLabels: { app.kubernetes.io/name: frontend } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: gaming-platform
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
