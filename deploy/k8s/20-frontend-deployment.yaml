# =============================================================================
# Frontend Deployment + Service (Phase 7, STEP 2 & 10).
# Hardened: non-root, read-only rootfs, dropped capabilities, seccomp, probes,
# resource limits, rolling update with surge control + graceful drain.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gaming-platform
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: gaming-platform }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } # zero-downtime rollout
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: gaming-platform }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: frontend } }
      containers:
        - name: frontend
          image: ghcr.io/gaming-platform/frontend:__IMAGE_TAG__ # set by CI (immutable digest preferred)
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000, name: http }]
          envFrom:
            - configMapRef: { name: gaming-platform-config }
            - secretRef: { name: gaming-platform-secrets }
          env:
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['app.kubernetes.io/version']"
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          lifecycle:
            preStop: { exec: { command: ["sleep", "10"] } } # let LB drain before exit
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nextcache, mountPath: /app/apps/frontend/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nextcache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gaming-platform
  labels: { app.kubernetes.io/name: frontend }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: frontend }
  ports: [{ port: 80, targetPort: http, name: http }]
