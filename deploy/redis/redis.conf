# =============================================================================
# Production Redis configuration (Phase 7, STEP 5).
# Roles: distributed cache, session cache, rate-limit cache, worker queues.
# Tune maxmemory to ~75% of the container memory limit.
# =============================================================================

# --- Networking / security --------------------------------------------------
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
# requirepass is injected from the secret manager at runtime (never commit it).

# --- Memory management -------------------------------------------------------
maxmemory 3gb
# Evict least-recently-used keys with a TTL first; queues use no-TTL keys so they
# are retained. Rate-limit / cache keys always carry a TTL.
maxmemory-policy allkeys-lru
maxmemory-samples 5

# --- Persistence -------------------------------------------------------------
# AOF for durability of queue state (everysec = ~1s worst-case data loss).
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# RDB snapshots as a coarse backup layer.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

# --- Slow log / latency monitoring ------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# --- Keyspace notifications (used by delayed-job schedulers) -----------------
notify-keyspace-events "Ex"

# --- Client limits -----------------------------------------------------------
maxclients 10000
