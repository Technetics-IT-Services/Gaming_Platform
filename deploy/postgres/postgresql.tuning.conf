# =============================================================================
# Production PostgreSQL tuning (Phase 7, STEP 4).
# Baseline for a ~4 vCPU / 16 GB primary. Adjust to the actual instance size.
# The ledger is the financial source of truth — durability settings are strict.
# =============================================================================

# --- Connections (PgBouncer fronts this; keep max_connections modest) --------
max_connections = 200
superuser_reserved_connections = 5

# --- Memory ------------------------------------------------------------------
shared_buffers = 4GB                 # ~25% of RAM
effective_cache_size = 12GB          # ~75% of RAM
work_mem = 16MB
maintenance_work_mem = 512MB

# --- WAL / durability (strict — financial ledger) ---------------------------
wal_level = replica                  # enables streaming replicas + PITR
synchronous_commit = on              # never lose a committed ledger entry
full_page_writes = on
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
archive_mode = on
archive_command = 'wal-g wal-push %p' # continuous WAL archiving for PITR

# --- Replication (read replicas for reporting/analytics) ---------------------
max_wal_senders = 10
wal_keep_size = 2GB
hot_standby = on
hot_standby_feedback = on

# --- Planner / parallelism ---------------------------------------------------
random_page_cost = 1.1               # SSD
effective_io_concurrency = 200
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# --- Autovacuum (keep the ledger + high-write tables healthy) ---------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s

# --- Observability -----------------------------------------------------------
logging_collector = on
log_min_duration_statement = 500     # log slow queries (>500ms)
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# --- Statement timeouts (protect against runaway queries) --------------------
statement_timeout = 30000            # 30s
idle_in_transaction_session_timeout = 60000
